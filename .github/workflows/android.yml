name: BALOCHFX Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            m4 \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            gettext \
            build-essential

          libtoolize --version
          autoconf --version
          automake --version

      - name: Configure Java 17
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH" >> "$GITHUB_ENV"

      - name: Verify Java
        run: |
          java -version
          javac -version

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
          python -m pip --version

      - name: Install Python build tools
        run: |
          python -m pip install "cython==0.29.37"
          python -m pip install buildozer

      - name: Prepare Autotools environment
        run: |
          export ACLOCAL_PATH="/usr/share/aclocal"
          echo "ACLOCAL_PATH=$ACLOCAL_PATH" >> "$GITHUB_ENV"

          libtoolize --force --copy
          aclocal
          autoconf --version
          automake --version
          libtool --version

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/licenses"

          yes | buildozer android debug || true

      - name: Build APK
        run: |
          yes | buildozer android debug

      - name: Find APK
        run: |
          echo "APK files:"
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BalochFX-APK
          path: bin/*.apk
          if-no-files-found: error
