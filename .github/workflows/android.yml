name: BALOCHFX Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libffi-dev libssl-dev cmake

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython<3.4"
          python -m pip install buildozer

      - name: Check project
        run: |
          pwd
          ls -la
          test -f main.py
          test -f buildozer.spec

      - name: Prepare Buildozer SDK
        run: |
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/tools/bin"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" \
            "$HOME/.buildozer/android/platform/android-sdk/tools/bin/avdmanager"
          ln -sf "$ANDROID_HOME/platform-tools/adb" \
            "$HOME/.buildozer/android/platform/android-sdk/platform-tools"
          echo "SDK manager:"
          "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager" --version

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |
          yes | buildozer -v android debug

      - name: Find APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BALOCHFX-APK
          path: bin/*.apk
