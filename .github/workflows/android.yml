name: BALOCHFX Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            m4 \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            gettext \
            build-essential

      - name: Configure Java 17
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"

      - name: Verify build environment
        run: |
          java -version
          javac -version
          python3 --version
          autoconf --version
          automake --version
          libtool --version
          libtoolize --version
          aclocal --version

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
          python -m pip --version

      - name: Install Buildozer
        run: |
          python -m pip install "cython==0.29.37"
          python -m pip install buildozer

      - name: Configure Autotools
        run: |
          echo "ACLOCAL_PATH=/usr/share/aclocal" >> "$GITHUB_ENV"
          echo "ACLOCAL_FLAGS=-I /usr/share/aclocal" >> "$GITHUB_ENV"
          echo "LIBTOOLIZE=libtoolize" >> "$GITHUB_ENV"
          echo "AUTOMAKE=automake" >> "$GITHUB_ENV"
          echo "AUTOCONF=autoconf" >> "$GITHUB_ENV"

          export ACLOCAL_PATH=/usr/share/aclocal
          export ACLOCAL_FLAGS="-I /usr/share/aclocal"

          test -f /usr/share/aclocal/libtool.m4
          grep -n "LT_SYS_SYMBOL_USCORE" /usr/share/aclocal/libtool.m4

      - name: Prepare Buildozer
        run: |
          buildozer android clean || true

      - name: Accept Android SDK licenses
        run: |
          yes | buildozer android debug || true

      - name: Build APK
        env:
          ACLOCAL_PATH: /usr/share/aclocal
          ACLOCAL_FLAGS: -I /usr/share/aclocal
          LIBTOOLIZE: libtoolize
        run: |
          yes | buildozer android debug

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BalochFX-APK
          path: bin/*.apk
          if-no-files-found: error
